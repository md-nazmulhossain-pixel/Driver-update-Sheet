<!DOCTYPE html>
<!--
  Driver Update Sheet
  Designed & developed by: (your name is set in DEVELOPER near the top of the script below)
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="author" content="">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driver Update Sheet</title>
<style>
:root{
  --bg:#eef0fb;--card:#fff;--ink:#1d1b36;--muted:#6c6a8a;--line:#e3e1f2;--mine:#eefaf3;--warn:#fff4d6;--warnink:#7a5200;
  --shadow:0 10px 30px rgba(60,50,140,.12);--cur:#475569;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12111c;--card:#1c1a2b;--ink:#eeecfa;--muted:#9d9abb;--line:#2e2b44;--mine:#173028;--warn:#3a2f10;--warnink:#f5d98a;--shadow:0 10px 30px rgba(0,0,0,.45);
}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;padding:14px 10px 30px;
  background:radial-gradient(900px 400px at 10% -10%,rgba(109,93,252,.22),transparent 60%),radial-gradient(800px 400px at 100% 0,rgba(236,72,153,.16),transparent 60%),var(--bg)}
.shell{max-width:1600px;margin:0 auto}
@media (min-width:761px){body{padding:22px clamp(20px,5vw,90px) 40px}}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-bottom:20px;animation:drop .6s cubic-bezier(.2,.8,.2,1) both}
.hright{justify-self:end;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.hperson{justify-self:center;display:flex;align-items:center;gap:12px;background:var(--card);padding:6px 20px 6px 8px;border-radius:99px;box-shadow:var(--shadow);animation:pop .4s both}
.hperson[hidden]{display:none}
.hperson .av{width:52px;height:52px;font-size:18px}
.hperson .who{text-align:left}
h1{margin:0;font-size:clamp(24px,4vw,34px);letter-spacing:-.02em;font-weight:800}
.date{color:var(--muted);font-weight:600}
.status{display:inline-flex;align-items:center;gap:10px;padding:6px 8px 6px 14px;border-radius:99px;background:var(--card);box-shadow:var(--shadow);font-size:13px;font-weight:600}
.status i{width:8px;height:8px;border-radius:50%;background:#f59e0b}
.status.ok i{background:#22c55e;animation:pulse 1.8s infinite}
.status.bad i{background:#ef4444}
.status button{font:inherit;font-size:12px;font-weight:700;cursor:pointer;border:0;border-radius:99px;padding:4px 12px;background:var(--cur);color:#fff;transition:transform .2s}
.status button:hover{transform:scale(1.06)}
.lo{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:99px;padding:8px 18px;background:#ef4444;color:#fff;box-shadow:var(--shadow);transition:transform .2s;animation:pop .35s both}
.lo.in{background:#6d5dfc}
.lo:hover{transform:scale(1.06)}.lo[hidden]{display:none}
.status button.spin{animation:spin .8s linear infinite}

.toast{position:fixed;right:18px;bottom:18px;z-index:20;max-width:min(92vw,420px);background:#1d1b36;color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transform:translateY(12px);transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:none}.toast.err{background:#dc2626}
.warn{background:var(--warn);color:var(--warnink);border-radius:14px;padding:12px 16px;margin-bottom:14px;font-size:13.5px;display:none}
.warn small{opacity:.85}
.warn.show{display:block;animation:drop .4s both}

/* main group cards */
.mains{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:12px}
.mbtn{--c:#6d5dfc;position:relative;overflow:hidden;text-align:left;font:inherit;color:var(--ink);cursor:pointer;
  border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:18px 20px 18px 24px;box-shadow:var(--shadow);
  transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .25s,box-shadow .25s;
  opacity:0;animation:rise .55s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--n)*80ms + 120ms)}
.mbtn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.mbtn::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));
  clip-path:circle(0% at 100% 0);transition:clip-path .5s cubic-bezier(.2,.8,.2,1)}
.mbtn>*{position:relative;z-index:1;transition:color .3s}
.mbtn:hover{transform:translateY(-4px);border-color:var(--c)}
.mbtn:active{transform:scale(.98)}
.mbtn.on{border-color:transparent;transform:translateY(-4px);box-shadow:0 16px 34px color-mix(in srgb,var(--c) 45%,transparent)}
.mbtn.on::after{clip-path:circle(150% at 100% 0)}
.mbtn.on>*{color:#fff}
.mbtn:focus-visible,.chip:focus-visible{outline:3px solid var(--c);outline-offset:3px}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mname{font-weight:800;font-size:19px}
.mcount{font-size:30px;font-weight:800;line-height:1}
.msub{display:block;margin-top:4px;font-size:12.5px;color:var(--muted)}

/* sub group chips */
.subs{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.2,.8,.2,1);margin-bottom:0}
.subs.open{grid-template-rows:1fr;margin-bottom:12px}
.subs>div{overflow:hidden;min-height:0}
.chips{display:flex;flex-wrap:wrap;gap:10px;padding:4px 2px 6px}
.chip{--c:#6d5dfc;font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:10px;padding:9px 16px;border-radius:99px;
  border:1.5px solid var(--c);background:var(--card);color:var(--ink);font-weight:700;
  transition:transform .2s,background .25s,color .25s,box-shadow .25s;animation:pop .4s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--n)*60ms)}
.chip:hover{transform:translateY(-2px);box-shadow:0 8px 18px color-mix(in srgb,var(--c) 30%,transparent)}
.chip.on{background:var(--c);color:#fff;box-shadow:0 8px 18px color-mix(in srgb,var(--c) 40%,transparent)}
.chip small{font-weight:600;opacity:.8}
.chip b{background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);padding:0 9px;border-radius:99px;font-size:13px}
.chip.on b{background:rgba(255,255,255,.25);color:#fff}

/* info + search */
.bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;animation:drop .6s .3s both}
.info{flex:1 1 360px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--card);border-radius:14px;padding:11px 16px;box-shadow:var(--shadow);border-left:5px solid var(--cur);transition:border-color .3s}
.info b{color:var(--cur)}
.pill{margin-left:auto;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap;background:var(--line);color:var(--muted)}
.pill.edit{background:#22c55e;color:#fff}
.grow{flex:1 1 220px}
.meta{display:flex;align-items:center;gap:10px}
.av{width:44px;height:44px;border-radius:50%;background:var(--cur);color:#fff;display:grid;place-items:center;font-weight:800;overflow:hidden;flex:none;animation:pop .4s both}
.av img{width:100%;height:100%;object-fit:cover}
.who{display:flex;flex-direction:column;line-height:1.25}.who small{color:var(--muted)}
.pinbox{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pinbox.shake{animation:shake .4s}
.pininp{font:inherit;width:130px;padding:6px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.pininp:focus{outline:none;border-color:var(--cur)}
.ubtn{font:inherit;font-weight:700;border:0;border-radius:99px;padding:7px 18px;background:var(--cur);color:#fff;cursor:pointer;transition:transform .2s}
.ubtn:hover{transform:scale(1.05)}.ubtn.red{background:#ef4444}
.pinmsg{color:#ef4444;font-weight:700;font-size:13px}.pinmsg:empty{display:none}
.search{flex:0 1 280px;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 16px;box-shadow:var(--shadow);transition:border-color .2s}
.search:focus{outline:none;border-color:var(--cur)}

/* table */
.wrap{overflow:auto;max-height:calc(100vh - 110px);min-height:260px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);animation:drop .6s .4s both}
table{border-collapse:collapse;width:100%}
th{position:sticky;top:0;z-index:3;box-shadow:0 2px 0 rgba(0,0,0,.08);background:linear-gradient(135deg,#5b4bd8,#8b5cf6);color:#fff;padding:10px 6px;font-size:12.5px;font-weight:700;text-align:center}
td{padding:7px 6px;text-align:center;border-top:1px solid var(--line);font-size:14px;overflow-wrap:anywhere}
td:nth-child(2){white-space:nowrap;overflow-wrap:normal}
td.l{text-align:left}
tbody tr{animation:rowIn .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*26ms);transition:background .2s}
tbody tr:hover td{background:color-mix(in srgb,var(--cur) 8%,transparent)}
tr.mine td{background:var(--mine)}
.st{display:inline-block;padding:2px 11px;border-radius:99px;font-size:12.5px;font-weight:700;white-space:nowrap;background:hsl(var(--h) 70% 45%/.16);color:hsl(var(--h) 65% 36%)}
@media (prefers-color-scheme:dark){.st{color:hsl(var(--h) 85% 74%)}}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;color:#fff;font-size:12px;font-weight:700}
td input{font:inherit;width:100%;min-width:90px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:5px 9px;transition:border-color .2s,box-shadow .2s,background .3s}
td input:focus{outline:none;border-color:var(--cur);box-shadow:0 0 0 3px color-mix(in srgb,var(--cur) 25%,transparent)}
td input[data-f=phone]{min-width:122px}td input[data-f=vendor]{min-width:84px}
td input.miss{border-color:#ef4444}
td input.hit{animation:flash .9s}
.empty{padding:40px;text-align:center;color:var(--muted)}
.shimmer{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--line),transparent,var(--line));background-size:200% 100%;animation:sh 1.2s infinite}
.note{color:var(--muted);font-size:12.5px;margin-top:14px}

@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes rowIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}70%,100%{box-shadow:0 0 0 8px rgba(34,197,94,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sh{to{background-position:-200% 0}}
@keyframes flash{0%{background:rgba(34,197,94,.45)}100%{background:var(--card)}}
body:not(.landing) .total{display:none}
.total{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:30px;cursor:pointer;position:relative;overflow:hidden;
  background:color-mix(in srgb,var(--card) 80%,transparent);backdrop-filter:blur(14px);border:1.5px solid var(--line);
  border-radius:28px;padding:24px 34px;margin-bottom:18px;box-shadow:var(--shadow);animation:rise .7s cubic-bezier(.2,.8,.2,1) both;transition:transform .3s,box-shadow .3s}
.total:hover{transform:translateY(-3px);box-shadow:0 22px 50px rgba(80,60,200,.28)}
.total::before{content:"";position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent 0 60%,rgba(109,93,252,.22) 80%,transparent);animation:spin 10s linear infinite;pointer-events:none}
.total>*{position:relative}
.total:focus-visible{outline:3px solid #6d5dfc;outline-offset:3px}
.donut{position:relative;width:172px;height:172px}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .trk{fill:none;stroke:var(--line);stroke-width:12}
.donut .seg{fill:none;stroke-width:12;stroke-dasharray:0 400;transition:stroke-dasharray 1.4s cubic-bezier(.2,.8,.2,1),stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}
.dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.dc b{font-size:46px;font-weight:800;letter-spacing:-.03em}
.dc small{margin-top:4px;color:var(--muted);font-weight:600;font-size:13px}
.tinfo{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.tlabel{font-size:14px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px 22px;font-weight:600;font-size:16px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px}
.legend b{margin-left:6px}
.tgo{padding:9px 20px;border-radius:99px;background:linear-gradient(135deg,#6d5dfc,#ec4899);color:#fff;font-weight:700;transition:transform .25s,box-shadow .25s}
.total:hover .tgo{transform:translateX(6px);box-shadow:0 8px 20px rgba(236,72,153,.4)}
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blobs span{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(70px);opacity:.34;animation:drift 22s ease-in-out infinite alternate}
.blobs span:nth-child(1){background:#6d5dfc;left:-12vmax;top:-14vmax}
.blobs span:nth-child(2){background:#ec4899;right:-14vmax;top:6vmax;animation-duration:27s;animation-delay:-6s}
.blobs span:nth-child(3){background:#06b6d4;left:24vmax;bottom:-24vmax;animation-duration:31s;animation-delay:-12s}
@media (prefers-color-scheme:dark){.blobs span{opacity:.2}}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
@keyframes gmove{to{background-position:300% 0}}
h1{background:linear-gradient(90deg,#6366f1,#ec4899,#06b6d4,#6366f1);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gmove 9s linear infinite;cursor:pointer;width:fit-content}
/* landing cards */
.micon,.mbar,.mgo{display:none}
.mglow{position:absolute!important;inset:0;z-index:0!important;opacity:0;transition:opacity .3s;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--c) 24%,transparent),transparent 70%);pointer-events:none}
.mbtn:hover .mglow{opacity:1}
.landing .mains{grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.landing .mbtn{padding:24px 24px 22px 30px;border-radius:26px;min-height:215px;display:flex;flex-direction:column;transform-style:preserve-3d;will-change:transform}
.landing .mbtn:hover{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-6px)}
.landing .micon{display:grid;place-items:center;width:54px;height:54px;border-radius:17px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);margin-bottom:14px;transition:transform .4s}
.landing .micon svg{width:29px;height:29px}
.landing .mbtn:hover .micon{transform:rotate(-8deg) scale(1.12)}
.landing .mname{font-size:21px}.landing .mcount{font-size:48px}
.landing .msub{margin-top:6px;font-size:13.5px}
.landing .mbar{display:block;height:6px;border-radius:99px;background:var(--line);margin-top:auto;overflow:hidden}
.landing .mbar i{display:block;height:100%;width:0;background:var(--c);border-radius:99px;transition:width 1.3s cubic-bezier(.2,.8,.2,1)}
.landing .mgo{display:block;margin-top:12px;font-weight:700;color:var(--c)}
.landing .mgo em{display:inline-block;font-style:normal;transition:transform .25s}
.landing .mbtn:hover .mgo em{transform:translateX(6px)}
/* vehicle being edited */
tr.editing-row td{background:color-mix(in srgb,var(--g,var(--cur)) 13%,transparent)!important}
tr.editing-row td:first-child{box-shadow:inset 4px 0 0 var(--g,var(--cur))}
.ract{display:flex;gap:6px;margin-top:6px;justify-content:center;flex-wrap:wrap}
.ract button{font:inherit;font-size:12.5px;font-weight:700;border:0;border-radius:8px;padding:4px 10px;cursor:pointer;color:#fff;background:#16a34a;transition:transform .2s}
.ract button.no{background:#64748b}.ract button:hover{transform:scale(1.06)}
/* click-to-edit cells */
td.ec{cursor:pointer;position:relative;transition:background .2s,box-shadow .2s;border-radius:6px}
td.ec:hover{background:color-mix(in srgb,var(--cur) 13%,transparent)!important;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--cur) 55%,transparent)}
td.ec::after{content:"✎";font-size:.8em;margin-left:6px;opacity:0;transition:opacity .2s;color:var(--cur)}
td.ec:hover::after,td.ec:focus-visible::after{opacity:.95}
td.ec:focus-visible{outline:2px solid var(--cur);outline-offset:-2px}
td.ec.editing{background:transparent!important;box-shadow:none}td.ec.editing::after{display:none}
.dash{color:var(--muted)}
@media (hover:none){td.ec::after{opacity:.55}}
.ubtn.ghost{background:var(--line);color:var(--ink)}
.landing .bar,.landing .wrap,.landing .subs{display:none}
.modal{position:fixed;inset:0;z-index:30;background:rgba(10,8,25,.55);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;animation:fade .25s both}
.modal[hidden]{display:none}
.mcard{position:relative;width:min(92vw,380px);background:var(--card);border-radius:22px;padding:28px 24px 22px;box-shadow:0 24px 60px rgba(0,0,0,.4);animation:pop .3s cubic-bezier(.2,.8,.2,1) both;text-align:center}
.mcard.shake{animation:shake .4s}
.mcard h2{margin:0 0 4px;font-size:22px}.mcard p{margin:0 0 16px;color:var(--muted);min-height:1.2em}
.pinbig{width:100%;font:inherit;font-size:22px;letter-spacing:.3em;text-align:center;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.pinbig:focus{outline:none;border-color:#6d5dfc}
.mrow2{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.mcard .ubtn{background:#6d5dfc;padding:10px 28px}
.mx{position:absolute;top:8px;right:12px;border:0;background:none;color:var(--muted);font-size:28px;cursor:pointer;line-height:1}
.linkbtn{margin-top:14px;border:0;background:none;color:var(--muted);text-decoration:underline;font:inherit;font-size:13.5px;cursor:pointer}
@keyframes fade{from{opacity:0}to{opacity:1}}
.avwrap{position:relative;cursor:pointer;display:block;flex:none}
.avwrap::after{content:"✎";position:absolute;right:-3px;bottom:-3px;width:20px;height:20px;border-radius:50%;background:var(--card);color:var(--ink);box-shadow:0 1px 5px rgba(0,0,0,.35);display:grid;place-items:center;font-size:12px}
.avwrap:hover .av{filter:brightness(1.1)}
.vcat,.vbag{display:none}
/* phone layout: every vehicle becomes a large, easy-to-read card */
@media (max-width:760px){
  body{padding:10px 8px 28px;font-size:20px}
  header{align-items:center;margin-bottom:12px}
  h1{font-size:30px}.date{font-size:17px}
  .status{font-size:17px}.status button{font-size:16px;padding:8px 16px}
  .mains{grid-template-columns:repeat(3,1fr);gap:8px}
  .mbtn{padding:12px 10px 12px 15px;border-radius:14px}
  .mbtn::before{width:4px}
  .mrow{flex-direction:column;align-items:flex-start;gap:2px}
  .mname{font-size:18px;line-height:1.2}.mcount{font-size:32px}.msub{display:none}
  .chip{padding:12px 20px;font-size:19px}.chip small{display:none}.chip b{font-size:17px}
  .info{flex-basis:100%;font-size:19px;padding:14px 16px}
  .info small{font-size:15px}
  .pill{font-size:16px;padding:5px 14px}
  .pininp{font-size:20px;width:170px;padding:11px 18px}.ubtn{font-size:19px;padding:12px 24px}.pinmsg{font-size:17px}
  .av{width:58px;height:58px;font-size:21px}
  .search{flex:1 1 100%;font-size:19px;padding:15px 18px}
  .wrap{max-height:none;overflow:visible;background:transparent;box-shadow:none;min-height:0}
  table,tbody{display:block}
  thead{display:none}
  tbody tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 14px;position:relative;margin-top:16px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);margin-bottom:12px;padding:20px 14px 16px 16px;border-left:6px solid var(--g,var(--cur))}
  tr.mine{background:var(--mine)}
  tr.mine td,tbody tr:hover td{background:transparent}
  td{display:block;border:0;padding:0;text-align:left;font-size:21px;line-height:1.3;overflow-wrap:anywhere;min-width:0}
  td+td{border-top:0}
  td::before{content:attr(data-l);display:block;font-weight:600;color:var(--muted);font-size:15px;margin-bottom:3px;letter-spacing:.02em}
  td:first-child{display:none}
  td.l{text-align:left}
  /* card:  [Vehicle  OT ........ 100 bag]  [Driver name]  [Location | Sub Location]  [Capacity | Phone]  [Code | Vendor] */
  td[data-l="Category"],td[data-l="Bag"]{display:none}
  td[data-l="Vehicle No."]{order:1;grid-column:1/-1;display:flex;align-items:baseline;gap:10px;font-size:28px;font-weight:800}
  td[data-l="Vehicle No."]::before{display:none}

<script>
/* ================= SETTINGS ================= */
/* ===== YOUR MARK =====  Put your own name here. It is shown at the bottom of every page, in the PIN window,
   in the page title tooltip and as a signature in the browser console. */
const DEVELOPER={name:"Md.Nazmul Hossain",role:"Developer",contact:"nazmul.ruhrd@gmail.com"};   // contact: an e-mail, phone number or website (optional)
const REFRESH_SECONDS=15;   // how often the page quietly checks the Google Sheet for changes (smaller = faster, but more load)
const API_URL="https://script.google.com/macros/s/AKfycbxVcDt16nblwWaKFC3CXD4O-eU6dHuIVzIsP7zwarvdWCp1eCUi19OT7lNTkR6F2j4/exec"; // Google Apps Script Web App (reads and saves to your Google Sheet)

const MAINS={
  F:{name:"Factory Truck",sub:"Groups A, B, C",color:"#6d5dfc",groups:["A","B","C"]},
  G:{name:"Ghat Truck",sub:"Ghat A, Ghat B",color:"#ec4899",groups:["GA","GB"]},
  K:{name:"Bulk Carrier",sub:"Single group",color:"#0891b2",groups:["BK"]},
  ALL:{name:"All Vehicles",sub:"Every group",color:"#475569",groups:["A","B","C","GA","GB","BK"]}
};
const GROUPS={
  A:{main:"F",name:"A Group",sub:"100, 150, 200 bags",color:"#6d5dfc"},
  B:{main:"F",name:"B Group",sub:"300, 400 bags",color:"#16a34a"},
  C:{main:"F",name:"C Group",sub:"all others",color:"#f59e0b"},
  GA:{main:"G",name:"Ghat A Group",sub:"selected ghats",color:"#ec4899"},
  GB:{main:"G",name:"Ghat B Group",sub:"selected ghats",color:"#3b82f6"},
  BK:{main:"K",name:"Bulk Carrier Group",sub:"all bulk carriers",color:"#0891b2"}
};
function groupOf(r){
  const all=(r.loc+" "+r.cat+" "+r.sub+" "+r.cap).toLowerCase();
  if(all.includes("bulk"))return "BK";
  const small=[100,150,200].includes(r.bag);
  if(/ghat/i.test(r.loc))return small?"GA":"GB";
  return small?"A":[300,400].includes(r.bag)?"B":"C";
}

const norm=s=>String(s).toUpperCase().replace(/[^A-Z0-9]/g,"");

/* ================= STATE ================= */
let me=null,pinTarget=null;const timers={};let needPin=true;   // locked until the server says otherwise
const IDLE_MS=10*60*1000;let lastAct=Date.now();
let toastT;function toast(t,err){const e=$("toast");e.textContent=t;e.className="toast show"+(err?" err":"");clearTimeout(toastT);toastT=setTimeout(()=>e.className="toast",err?5000:1800)}
function apiCall(params){
  return new Promise((res,rej)=>{
    const cb="ap"+Math.random().toString(36).slice(2),s=document.createElement("script");let ok=false;
    const done=()=>{clearTimeout(t);delete window[cb];s.remove()};
    const t=setTimeout(()=>{done();rej(new Error("timed out"))},30000);
    window[cb]=d=>{ok=true;done();res(d)};
    s.onload=()=>{if(!ok){done();rej(new Error("the Web App returned a page, not data. In Deploy settings, 'Who has access' must be Anyone"))}};
    s.onerror=()=>{if(!ok){done();rej(new Error("blocked or no internet"))}};
    s.src=API_URL+(API_URL.indexOf("?")>=0?"&":"?")+new URLSearchParams(Object.assign({},params,{callback:cb})).toString();
    document.head.appendChild(s);
  });
}
const pend={};let saving=0;
function scheduleSave(r,field){
  (pend[r.v]=pend[r.v]||{})[field]=r[field];
  clearTimeout(timers[r.v]);
  timers[r.v]=setTimeout(async()=>{
    const ch=pend[r.v];delete pend[r.v];
    if(!ch||!Object.keys(ch).length)return;
    saving++;
    toast("Saving to Google Sheet…");
    try{
      const d=await apiCall(Object.assign({action:"save",v:r.v,group:r.g,pin:me?me.pin:""},ch));
      if(d.ok){
        if("code" in ch&&typeof d.name==="string"){
          r.name=d.name;
          const tr=[...$("body").children].find(t=>t.dataset&&t.dataset.v===r.v);
          if(tr)tr.querySelector("[data-name]").textContent=d.name;
        }
        toast("Saved to Google Sheet ✓");
      }else toast("Not saved: "+d.error,true);
    }catch(e){toast("Not saved: "+e.message,true)}
    saving--;
  },700);
}
let live=false,rows=[],drivers={},main=null,sub=null,query="";

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const setRows=list=>{rows=list.map(r=>{const o=Object.assign({},r);if(!(o.g&&GROUPS[o.g]))o.g=groupOf(o);return o})};
const inMain=(r,m)=>m==="ALL"||GROUPS[r.g].main===m;
const countG=g=>rows.filter(r=>r.g===g).length;
const countM=m=>rows.filter(r=>inMain(r,m)).length;

function save(r,obj){Object.assign(r,obj)}
function countUp(el,to){const t0=performance.now();(function f(t){const p=Math.min((t-t0)/600,1);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)}

/* ================= UI ================= */
const tickClock=()=>{const n=new Date();document.getElementById("date").textContent=n.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"})+" · "+n.toLocaleTimeString("en-GB")};
tickClock();setInterval(tickClock,1000);
const $=id=>document.getElementById(id);

function curColor(){return sub?GROUPS[sub].color:main?MAINS[main].color:"#475569"}

const ICON={
  F:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V9l6 3.5V9l6 3.5V5h4v16z"/><path d="M3 21h18"/></svg>',
  G:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2"/><path d="M12 7v14M8 11h8M5 14c0 4 3 7 7 7s7-3 7-7"/></svg>',
  K:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7h11v9H2zM13 10h4l4 3v3h-8"/><circle cx="7" cy="17.5" r="1.7"/><circle cx="17" cy="17.5" r="1.7"/></svg>'};
const gate=id=>{if(needPin&&!me){askPin(id);return}openMain(id)};   // PIN first, then open
function buildMains(){
  const box=$("mains");
  if(!box.children.length){
    Object.entries(MAINS).filter(([id])=>id!=="ALL").forEach(([id,m],n)=>{
      const b=document.createElement("button");
      b.className="mbtn";b.dataset.id=id;b.style.setProperty("--c",m.color);b.style.setProperty("--n",n);
      b.innerHTML='<span class="mglow"></span><span class="micon">'+ICON[id]+'</span><span class="mrow"><span class="mname">'+m.name+'</span><span class="mcount">0</span></span><span class="msub">'+m.sub+'</span><span class="mbar"><i></i></span><span class="mgo">Open <em>→</em></span>';
      b.onclick=()=>{
        if(main===id){main=null;sub=null;render();return}      // tap the open card again = back to the first page
        gate(id);
      };
      box.appendChild(b);
    });
  }
  const total=rows.length;
  [...box.children].forEach(b=>{
    b.classList.toggle("on",main===b.dataset.id);
    const el=b.querySelector(".mcount"),n=countM(b.dataset.id);
    if(el.dataset.n!==String(n)){el.dataset.n=n;countUp(el,n)}
    b.querySelector(".mbar i").style.width=(total?Math.round(n/total*100):0)+"%";
  });
}
const DC=2*Math.PI*52;
function updateTotal(){
  const total=rows.length,tn=$("totalN");
  if(tn.dataset.n!==String(total)){tn.dataset.n=total;countUp(tn,total)}
  let acc=0;
  document.querySelectorAll("#total .seg").forEach((c,i)=>{
    const m=c.dataset.m,n=countM(m),share=total?n/total:0,len=Math.max(share*DC-(n&&n<total?3:0),0);
    c.style.stroke=MAINS[m].color;c.style.strokeDasharray=len+" "+DC;c.style.strokeDashoffset=-(acc*DC);c.style.transitionDelay=(i*140)+"ms";
    acc+=share;
  });
  $("legend").innerHTML=Object.entries(MAINS).filter(([id])=>id!=="ALL").map(([id,m])=>'<span><i style="background:'+m.color+'"></i>'+m.name+'<b>'+countM(id)+'</b></span>').join("");
}
let wasLanding=true;
function replay(){document.querySelectorAll(".mbtn,.total").forEach(e=>{e.style.animation="none";void e.offsetWidth;e.style.animation=""})}
function openMain(id){main=id;sub=MAINS[id].groups.length===1?MAINS[id].groups[0]:null;render()}
let chipKey="";
function buildChips(){
  const subs=$("subs"),chips=$("chips");
  if(!main){subs.classList.remove("open");chipKey="";return}
  const k=main+"|"+sub+"|"+rows.length+"|"+(me?me.group:"");
  if(k===chipKey){subs.classList.add("open");return}
  chipKey=k;chips.innerHTML="";
  MAINS[main].groups.forEach((g,n)=>{
    const d=GROUPS[g],b=document.createElement("button");
    b.className="chip"+(sub===g?" on":"");b.style.setProperty("--c",d.color);b.style.setProperty("--n",n);
    b.innerHTML=d.name+' <small>'+d.sub+'</small> <b>'+countG(g)+'</b>'+(me&&me.group===g?' <span title="You can edit this group">✎</span>':'');
    b.onclick=()=>{sub=sub===g&&MAINS[main].groups.length>1?null:g;render()};
    chips.appendChild(b);
  });
  subs.classList.add("open");
}

const digits=x=>String(x==null?"":x).replace(/\D/g,"");
const hy=d=>d.length>5?d.slice(0,5)+"-"+d.slice(5):d;                // 01712-345678
const fmtPhone=x=>{const d=digits(x);return d.length===11?hy(d):String(x==null?"":x)};
const initials=n=>{const w=String(n||"").replace(/\./g,"").split(/\s+/).filter(x=>x&&!/^md$/i.test(x));return ((w[0]||"")[0]||"")+((w[1]||"")[0]||"")};
function makeAvatar(file){   // centre-crop to a square and shrink to a small JPEG
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{URL.revokeObjectURL(url);
      const m=Math.min(img.width,img.height);
      for(const size of [144,120,96]){
        const c=document.createElement("canvas");c.width=c.height=size;
        c.getContext("2d").drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,size,size);
        for(let q=.85;q>=.35;q-=.1){const out=c.toDataURL("image/jpeg",q);if(out.length<=8400)return res(out)}
      }
      rej(new Error("picture is too detailed, try another one"))};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("this file is not a picture"))};
    img.src=url;
  });
}
async function uploadPhoto(dataUrl){
  const id=Math.random().toString(36).slice(2,10),CH=1800,n=Math.ceil(dataUrl.length/CH);
  let last;
  for(let i=0;i<n;i++){
    last=await apiCall({action:"photo",group:me.group,pin:me.pin,id,i,n,data:dataUrl.slice(i*CH,(i+1)*CH)});
    if(!last.ok)throw new Error(last.error||"upload failed");
  }
  return last;
}
const avatar=p=>'<span class="av">'+(p.photo?'<img src="'+esc(p.photo)+'" alt="">':esc(initials(p.name)||"•"))+'</span>';

function render(){

  else if(me&&me.role==="admin"){msg="Admin: you can edit every group. Choose a group to edit.";pill="Admin"}
  else if(me&&!me.group){msg="View only: you can look at every group but cannot change anything.";pill="Read only"}
  else if(me){const g=GROUPS[me.group];msg='You can edit <b style="color:'+g.color+'">'+g.name+'</b> only. Other groups are view only.<br><small style="color:var(--muted)">Auto log-out after 10 minutes without an update.</small>';pill=mineHere?"Editing: "+g.name:"Read only";pc=mineHere?" edit":""}
  else{msg="View only.";pill="Read only"}
  info.innerHTML='<button id="gohome" class="ubtn ghost">← Home</button><span class="grow"><b>'+title+'</b> — '+list.length+' vehicles. '+msg+'</span>'

  $("gohome").onclick=()=>{main=null;sub=null;render()};

  list.forEach((r,n)=>{

      +tdh(7,'<span class="tag" style="background:'+GROUPS[r.g].color+'">'+GROUPS[r.g].name+'</span>')
      +tdh(8,esc(r.name),"l"," data-name")
      +(ed?ec(9,"code"):tdh(9,esc(r.code)))
      +(ed?ec(10,"phone"):tdh(10,esc(fmtPhone(r.phone))))
      +(ed?ec(11,"vendor"):tdh(11,esc(r.vendor)))
      +tdh(12,statusPill(r.status))+tdh(13,esc(r.hcode))+tdh(14,esc(r.hname))+tdh(15,esc(fmtPhone(r.hphone)));
    tr.dataset.v=r.v;
    if(ed){   // nothing is editable until you click the exact cell you want to change
      tr.addEventListener("click",e=>{const td=e.target.closest("td.ec");if(td)startEdit(tr,td,r)});
      tr.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("ec")){e.preventDefault();startEdit(tr,e.target,r)}});

const shown=(r,f)=>{const v=f==="phone"?fmtPhone(r.phone):r[f];return v?esc(v):'<span class="dash">—</span>'};
/* One vehicle at a time: clicking a cell of a vehicle opens Code No, Phone and Vendor of THAT vehicle only.
   Every other vehicle stays plain text, so nothing else can be changed by mistake. */
let activeRow=null;
const setName=(cell,nm)=>{if(cell&&cell.textContent!==nm){cell.textContent=nm;cell.classList.remove("hit");void cell.offsetWidth;cell.classList.add("hit")}};
function startEdit(tr,td,r){
  if(!canEdit(r))return;
  if(activeRow&&activeRow.tr===tr){const el=activeRow.els[td.dataset.f];if(el&&document.activeElement!==el)el.focus();return}
  closeEdit(true);                                  // finish the vehicle that was open before
  const els={},before={code:r.code,phone:r.phone,vendor:r.vendor},nameBefore=r.name,nameCell=tr.querySelector("[data-name]");
  tr.classList.add("editing-row");
  tr.querySelectorAll("td.ec").forEach(c=>{
    const f=c.dataset.f,el=document.createElement("input");
    el.dataset.f=f;el.autocomplete="off";el.setAttribute("aria-label",f);
    if(f==="code")el.maxLength=20;else if(f==="phone"){el.inputMode="numeric";el.maxLength=12;el.placeholder="01XXX-XXXXXX"}else{el.inputMode="numeric";el.maxLength=7}
    el.value=f==="phone"?fmtPhone(r.phone):r[f];
    c.classList.add("editing");c.textContent="";c.appendChild(el);els[f]=el;
    el.addEventListener("input",()=>{
      lastAct=Date.now();
      if(f==="phone"){const d=digits(el.value).slice(0,11);el.value=hy(d);el.classList.toggle("miss",!(d.length===0||d.length===11))}
      else if(f==="vendor"){el.value=digits(el.value).slice(0,7)}
      else{const nm=drivers[norm(el.value)]||"";el.classList.toggle("miss",!!el.value.trim()&&!nm&&Object.keys(drivers).length>0);setName(nameCell,nm)}   // preview only
    });
    el.addEventListener("keydown",e=>{
      if(e.key==="Enter"){e.preventDefault();closeEdit(true)}
      else if(e.key==="Escape"){e.preventDefault();closeEdit(false)}
    });
  });
  const bar=document.createElement("div");bar.className="ract";
  bar.innerHTML='<button type="button" class="ok">✓ Save</button><button type="button" class="no">✕ Cancel</button>';
  tr.querySelector('td.ec[data-f="vendor"]').appendChild(bar);
  bar.querySelector(".ok").onclick=e=>{e.stopPropagation();closeEdit(true)};
  bar.querySelector(".no").onclick=e=>{e.stopPropagation();closeEdit(false)};
  activeRow={tr,r,els,before,nameBefore,nameCell};lastAct=Date.now();
  const first=els[td.dataset.f]||els.code;first.focus();first.select();
}
function closeEdit(commit){
  if(!activeRow)return;
  const {tr,r,els,before,nameBefore,nameCell}=activeRow;activeRow=null;
  const changes={};
  if(commit){
    const code=els.code.value.trim(),ph=digits(els.phone.value).slice(0,11),ven=digits(els.vendor.value).slice(0,7);
    if(code!==before.code)changes.code=code;
    if(ph!==digits(before.phone)){if(ph.length===0||ph.length===11)changes.phone=ph;else toast("Phone number must be 11 digits — phone not changed",true)}
    if(ven!==before.vendor)changes.vendor=ven;
  }
  Object.keys(changes).forEach(f=>save(r,{[f]:changes[f]}));
  if("code" in changes){
    const nm=drivers[norm(changes.code)]||"";save(r,{name:nm});setName(nameCell,nm);
    if(changes.code&&!nm&&Object.keys(drivers).length)toast("Code not found in Driver File — saved anyway",true);
  }else setName(nameCell,nameBefore);
  tr.classList.remove("editing-row");
  tr.querySelectorAll("td.ec").forEach(c=>{c.classList.remove("editing");c.innerHTML=shown(r,c.dataset.f)});
  Object.keys(changes).forEach(f=>scheduleSave(r,f));
}

function status(kind,text){const s=$("status");s.className="status "+kind;$("stxt").textContent=text}
let lastSig="";
async function load(silent){
  if(!silent){live=false;status("","Loading from Google Sheet…");
  $("body").innerHTML='<tr><td colspan="16" style="padding:30px"><div class="shimmer"></div><br><div class="shimmer" style="width:70%"></div></td></tr>';}
  const w=$("warn");let same=false;
  if(!silent&&me&&!rows.length){try{const c=JSON.parse(localStorage.getItem("dashCache")||"null");
    if(c&&c.vehicles){setRows(c.vehicles);drivers=c.drivers||{};status("","Saved data · updating…");render()}}catch(e){}}
  try{
    const d=await apiCall({action:"read",pin:me?me.pin:""});
    if(d.locked){                                     // no (valid) PIN: the server sends no data at all
      needPin=true;
      if(me){lockUp("Session ended — enter your PIN again");return}
      setRows([]);drivers={};live=false;status("","🔒 Locked");w.classList.remove("show");render();
      if($("modal").hidden)askPin(null);
      return;
    }
    if(!d.ok)throw new Error(d.error||"unknown error");
    needPin=!!d.pinRequired;if(!needPin){me=null}
    const sig=JSON.stringify(d.vehicles);same=silent&&sig===lastSig;lastSig=sig;
    drivers=d.drivers||{};live=true;w.classList.remove("show");
    if(d.unassigned&&d.unassigned.length){w.innerHTML="<b>These ghat names are not in any group yet:</b> "+d.unassigned.map(esc).join(", ")+" — they are placed in <b>"+GROUPS[d.ghatDefault||"GB"].name+"</b> for now. Add them to GHAT_A or GHAT_B in Code.gs.";w.classList.add("show")}
    if(!same)setRows(d.vehicles);
    try{localStorage.setItem("dashCache",JSON.stringify({vehicles:d.vehicles,drivers:d.drivers||{}}))}catch(e){}
    status("ok",rows.length+" vehicles · "+rows.filter(r=>r.code||r.name).length+" with driver · live · "+new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}));
  }catch(e){
    if(silent){status("bad","Connection lost — retrying");return}
    setRows([]);drivers={};
    w.innerHTML="<b>Could not load data from Google Sheet:</b> "+esc(e.message)+'<br><small>Check: the Apps Script is deployed as a Web App with <b>Execute as: Me</b> and <b>Who has access: Anyone</b>, the latest code is deployed as a <b>New version</b>, and you allowed the permissions. <a href="'+API_URL+'?action=read" target="_blank" rel="noopener">Open the Web App link to see its raw reply</a>.</small>';
    w.classList.add("show");status("bad","Not connected");
  }
  if(!same)render();
}

.dtw{position:relative;display:flex;align-items:center;height:1.7rem;padding:0 .5rem;border-radius:.5rem;background:rgba(255,255,255,.14);font-size:.68rem;white-space:nowrap}
.dr{margin:0 0 .6rem}
.dtw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0}
.nw{width:2.3rem;height:2.3rem;border-radius:.7rem;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:1.2rem}
.lb{font-size:.9rem;opacity:.8;margin:0 0 .35rem .3rem}
.plate{display:block;width:100%;height:5.4rem;padding:0 .5rem;text-align:center;font:800 3rem system-ui,sans-serif;letter-spacing:.1rem;color:#111;background:#fff8dc;border:.3rem solid #111;border-radius:1rem;box-shadow:0 0 0 .25rem rgba(255,255,255,.22),0 .6rem 1.2rem rgba(0,0,0,.28)}
.plate::placeholder{color:#cdc5a2}
.plate:focus{outline:none;box-shadow:0 0 0 .3rem #46c0d3,0 .6rem 1.2rem rgba(0,0,0,.28)}
.ds{font-size:.75rem;opacity:.75;margin:.4rem .3rem 0}
.w{display:flex;flex-direction:column;gap:.9rem;padding:1.1rem .8rem 0}
.card{background:var(--cd);border-radius:1.5rem;padding:.9rem 1rem;box-shadow:0 .4rem 1.4rem rgba(10,40,50,.09)}
.ar{align-self:center;width:2.4rem;height:2.4rem;margin:-1.65rem 0;position:relative;z-index:2;border-radius:50%;background:var(--pr);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:800;border:.2rem solid var(--bg)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:.4rem}
h2{font-size:1.05rem;margin:0;color:var(--mu);font-weight:600}
.rt{display:flex;gap:.4rem;align-items:center}
.chip{font-size:.85rem;font-weight:700;border-radius:1rem;padding:.15rem .7rem;white-space:nowrap}
.chip[hidden],.nx[hidden]{display:none}
.chip.ok{background:rgba(18,128,63,.14);color:var(--ok)}
.chip.wr{background:rgba(178,94,0,.15);color:var(--wr)}
.chip.co{background:rgba(91,63,196,.15);color:var(--co)}
.nx{font:inherit;font-size:.85rem;border:.1rem solid var(--bd);background:var(--in);color:var(--tx);border-radius:1rem;padding:.15rem .6rem}
.pb b{display:block;font-size:1.55rem;line-height:1.25}
.pb b.co{color:var(--co)}
.pb span{font-size:1.15rem;color:var(--mu)}
.g2{display:grid;grid-template-columns:.9fr 1.1fr;gap:.5rem;margin-bottom:.5rem}
.fl{display:block;position:relative;min-width:0}
.fl span{position:absolute;left:.8rem;top:.4rem;font-size:.72rem;color:var(--mu);pointer-events:none}
.f{width:100%;height:3.8rem;padding:1.1rem .6rem 0 .8rem;font:inherit;font-size:1.4rem;color:var(--tx);background:var(--in);border:.12rem solid var(--bd);border-radius:1rem}
.f:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 .2rem color-mix(in srgb,var(--pr) 25%,transparent)}
.code{font-weight:700;font-size:1.45rem}
.tel{font-size:1.2rem}
.ticks{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin-top:.5rem}
.tick{transition:opacity .2s}
.tick.off{opacity:.3}
.nh{display:block;width:100%;margin-top:.55rem;font:inherit;font-size:1rem;font-weight:700;color:var(--wr);background:transparent;border:.12rem dashed var(--wr);border-radius:.9rem;padding:.5rem}
.nh.on{background:#c26a00;border:.12rem solid #c26a00;color:#fff}
.nh[hidden]{display:none}
.tick{--c:#e08a00;display:flex;align-items:center;gap:.35rem;min-width:0;font-size:.82rem;font-weight:700;border:.12rem solid var(--bd);border-radius:1rem;padding:.6rem .4rem;background:var(--in)}
.tick.b{--c:#12803f}
.tick.c{--c:#2d6cdf}
.tick:has(input:checked){border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.tick input{appearance:none;-webkit-appearance:none;width:1.4rem;height:1.4rem;margin:0;border-radius:50%;border:.14rem solid var(--bd);flex:none}
.tick input:checked{background:var(--c);border-color:var(--c)}
.tick input:checked::after{content:"✓";display:block;color:#fff;text-align:center;line-height:1.1rem;font-size:.95rem;font-weight:800}
.bar{padding:1rem .8rem 0}
.hint{font-size:.95rem;color:var(--wr);margin:0 0 .5rem;text-align:center}
.hint.ok{color:var(--ok);font-weight:700}
.wa{display:flex;align-items:center;justify-content:center;gap:.6rem;width:100%;height:4rem;border:0;border-radius:1.3rem;font:inherit;font-size:1.4rem;font-weight:700;color:#fff;background:linear-gradient(135deg,#25d366,#128c4a);box-shadow:0 .5rem 1.2rem rgba(18,140,74,.35)}
.wa svg{width:1.6rem;height:1.6rem;fill:#fff}
.wa:disabled{opacity:.35;box-shadow:none}
@media (min-aspect-ratio:10/19){.plate{height:4.6rem}.f{height:3.3rem;padding-top:.95rem}.tick{padding:.45rem .4rem}.wa{height:3.5rem}.w{gap:.7rem;padding-top:.9rem}.hd{padding-bottom:1rem}}
#sp{position:fixed;inset:0;z-index:99;background:radial-gradient(70% 38% at 50% 30%,rgba(255,205,60,.18),transparent 70%),linear-gradient(165deg,#040d1c 0%,#0a1f3d 55%,#0b3a52 100%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:calc(2.2rem + env(safe-area-inset-top)) 1.5rem calc(1rem + env(safe-area-inset-bottom));transition:opacity .6s;overflow:hidden}
#sp .fi{opacity:0;animation:fi .9s ease forwards;animation-delay:var(--d,0s)}
.lgw{position:relative;width:10rem;height:11rem;margin:0 auto;animation:pop .9s cubic-bezier(.2,1.25,.3,1) both}
.glow{position:absolute;left:50%;top:46%;width:21rem;height:21rem;margin:-10.5rem 0 0 -10.5rem;border-radius:50%;background:radial-gradient(circle,rgba(255,205,60,.38),transparent 62%);animation:gl 2.6s ease-in-out infinite}
.lg{position:relative;width:10rem;height:10rem;border-radius:18%;overflow:hidden;animation:fl 3.2s ease-in-out infinite}
.lg img{display:block;width:100%;height:100%}
.sh{position:absolute;top:0;left:-60%;width:38%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-18deg);animation:shn 3.4s ease-in-out 1.3s infinite}
.shd{position:absolute;left:50%;bottom:.1rem;width:10rem;height:.9rem;margin-left:-5rem;border-radius:50%;background:rgba(0,0,0,.5);filter:blur(.35rem);animation:sd 3.2s ease-in-out infinite}
.mid{flex:1;display:flex;align-items:center;justify-content:center}
.dv{margin-bottom:1.3rem}
.dv small{display:block;font-size:.65rem;opacity:.65;letter-spacing:.08rem}
.dv b{display:block;font-size:1.05rem;margin:.05rem 0}
.dv span{font-size:.75rem;opacity:.85}
.dv p{margin:.5rem 0 0;font-size:.72rem;font-style:italic;opacity:.75}
.pbar{width:15rem;height:.35rem;border-radius:1rem;background:rgba(255,255,255,.15);overflow:hidden;margin:0 auto}
#bar{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd54a,#6fd36f);border-radius:1rem;transition:width .15s linear}
.stx{font-size:.8rem;opacity:.85;margin-top:.6rem;letter-spacing:.05rem}
.dots{display:inline-block;overflow:hidden;vertical-align:bottom;width:0;animation:dt 1.2s steps(4) infinite}
#sx{margin-top:.6rem;font:inherit;font-size:1rem;color:#fff;background:rgba(255,255,255,.14);border:.1rem solid rgba(255,255,255,.4);border-radius:1rem;padding:.4rem 1.2rem}
#sx[hidden]{display:none}
.ver{margin-top:.8rem;font-size:.65rem;opacity:.55;letter-spacing:.08rem}
#sp.er #bar{background:#ff7a59}
@keyframes fi{from{opacity:0;transform:translateY(.7rem)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.55) translateY(1.5rem)}to{opacity:1;transform:none}}
@keyframes fl{0%,100%{transform:perspective(60rem) translateY(0) rotateY(-6deg) rotateX(2deg)}50%{transform:perspective(60rem) translateY(-.7rem) rotateY(6deg) rotateX(-1deg)}}
@keyframes shn{0%{left:-60%}55%,100%{left:130%}}
@keyframes sd{0%,100%{transform:scaleX(1);opacity:.5}50%{transform:scaleX(.78);opacity:.28}}
@keyframes gl{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
@keyframes dt{to{width:1.1em}}

/* ছোট করা: বাটন, তারিখ, হেডার লোগো */
.hlg{width:2rem;height:2rem;border-radius:.5rem;vertical-align:middle;margin-right:.4rem;object-fit:cover}
.dtw{height:1.4rem;padding:0 .4rem;font-size:.6rem}
.tick{font-size:.7rem;gap:.2rem;padding:.4rem .15rem;white-space:nowrap;overflow:hidden;justify-content:center;line-height:1.2}
.tick input{width:1rem;height:1rem}
.tick input:checked::after{font-size:.65rem;line-height:.9rem}

/* ===== লগইন পেজ ===== */
#lg{position:fixed;inset:0;z-index:100000;display:none;align-items:center;justify-content:center;padding:1.2rem;background:radial-gradient(90% 45% at 90% 0%,rgba(70,192,211,.40),transparent 60%),linear-gradient(165deg,#06222a 0%,#0a3a48 50%,#12405f 100%)}
#lg.show{display:flex}
.lgbox{width:100%;max-width:320px;padding:1.3rem 1.1rem;border-radius:1rem;background:rgba(255,255,255,.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.26);box-shadow:0 .5rem 1.6rem rgba(0,0,0,.3);color:#eaf6f8;text-align:center}
.lgbox img{width:4.5rem;height:4.5rem;border-radius:1rem;object-fit:cover}
.lgbox h2{margin:.5rem 0 .2rem;font-size:1.1rem}
.lgbox p{margin:0 0 .8rem;font-size:.8rem;color:#cfe6ea}
#lgp{width:100%;height:2.6rem;border-radius:.6rem;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;text-align:center;font-size:1.1rem;letter-spacing:.2rem;outline:none}
#lgp:focus{border-color:#46c0d3}
#lgb{margin-top:.7rem;width:100%;height:2.6rem;border:0;border-radius:.6rem;background:rgba(70,192,211,.9);color:#fff;font-weight:700;font-size:.95rem;cursor:pointer}

/* ===== Driver and Vehicle Information (শুধু দেখার জন্য) ===== */
#dvb{display:block;width:calc(100% - 2rem);margin:0 1rem .6rem;height:2.1rem;border-radius:.6rem;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;font-size:.8rem;font-weight:600;cursor:pointer}
body.dv #dview,body.vo #dview{display:block}
body.dv .hd,body.dv .w,body.dv .bar,body.vo .hd,body.vo .w,body.vo .bar{display:none}
body.vo #dvb,body.vo #dvx{display:none}

/* ===== শুধু দেখার পেজ: পুরনো Driver Update Sheet-এর ডিজাইন ===== */
body.dv,body.vo{background:radial-gradient(900px 400px at 10% -10%,rgba(109,93,252,.22),transparent 60%),radial-gradient(800px 400px at 100% 0,rgba(236,72,153,.16),transparent 60%),#eef0fb !important;color:#1d1b36 !important;font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif !important}
@media (prefers-color-scheme:dark){body.dv,body.vo{background:radial-gradient(900px 400px at 10% -10%,rgba(109,93,252,.22),transparent 60%),radial-gradient(800px 400px at 100% 0,rgba(236,72,153,.16),transparent 60%),#12111c !important;color:#eeecfa !important}}
#dview{--card:#fff;--ink:#1d1b36;--muted:#6c6a8a;--line:#e3e1f2;--shadow:0 10px 30px rgba(60,50,140,.12);--cur:#6d5dfc;display:none;max-width:1600px;margin:0 auto;padding:14px 10px 30px;color:var(--ink)}
@media (prefers-color-scheme:dark){#dview{--card:#1c1a2b;--ink:#eeecfa;--muted:#9d9abb;--line:#2e2b44;--shadow:0 10px 30px rgba(0,0,0,.45)}}
@media (min-width:761px){#dview{padding:22px clamp(20px,5vw,90px) 40px}}
body.dv #dview,body.vo #dview{display:block}
#dview .dv-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px}
#dview h1{margin:0;font-size:clamp(22px,4vw,32px);letter-spacing:-.02em;font-weight:800}
#dview .dv-date{color:var(--muted);font-weight:600;font-size:14px}
#dview .dv-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#dview .dv-pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--line);color:var(--muted)}
#dview .dv-btn{font:inherit;font-weight:700;font-size:13px;cursor:pointer;border:0;border-radius:99px;padding:8px 16px;background:var(--cur);color:#fff;box-shadow:var(--shadow);transition:transform .2s}
#dview .dv-btn:hover{transform:scale(1.05)}
#dview .dv-btn.red{background:#ef4444}
#dview .dv-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
#dview .dv-tabs{display:flex;gap:8px}
#dview .dv-tabs button{font:inherit;font-weight:700;font-size:13.5px;cursor:pointer;padding:8px 18px;border-radius:99px;border:1.5px solid var(--cur);background:var(--card);color:var(--ink);transition:background .25s,color .25s}
#dview .dv-tabs button.on{background:var(--cur);color:#fff}
#dview .dv-search{flex:0 1 300px;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:9px 16px;box-shadow:var(--shadow)}
#dview .dv-search:focus{outline:none;border-color:var(--cur)}
#dview .dv-count{margin-left:auto;font-size:13px;font-weight:700;color:var(--muted)}
#dview .dv-wrap{overflow:auto;max-height:calc(100vh - 190px);min-height:200px;background:var(--card);border-radius:18px;box-shadow:var(--shadow)}
#dview table{border-collapse:collapse;width:100%}
#dview th{position:sticky;top:0;z-index:3;background:linear-gradient(135deg,#5b4bd8,#8b5cf6);color:#fff;padding:10px 6px;font-size:12.5px;font-weight:700;text-align:center;white-space:nowrap}
#dview td{padding:7px 8px;text-align:center;border-top:1px solid var(--line);font-size:14px;white-space:nowrap}
#dview tbody tr:hover td{background:rgba(109,93,252,.08)}
#dview .dv-empty{padding:40px;text-align:center;color:var(--muted)}

/* ===== লাভেন্ডার থিম: হ্যান্ডওভার, লগইন ও শুধু-দেখার পেজ ===== */
:root{--bg:#eef0fb;--cd:#ffffff;--tx:#1d1b36;--mu:#6c6a8a;--pr:#6d5dfc;--in:#f6f5ff;--bd:#e3e1f2;--co:#5b3fc4}
@media (prefers-color-scheme:dark){:root{--bg:#12111c;--cd:#1c1a2b;--tx:#eeecfa;--mu:#9d9abb;--pr:#8b7cff;--in:#16142a;--bd:#2e2b44;--co:#b6a3ff}}
body{background:radial-gradient(900px 400px at 10% -10%,rgba(109,93,252,.22),transparent 60%),radial-gradient(800px 400px at 100% 0,rgba(236,72,153,.16),transparent 60%),var(--bg)}
.hd{background:linear-gradient(135deg,#5b4bd8,#8b5cf6);color:#fff}
.nw,.dtw{background:rgba(255,255,255,.2)}
.card{box-shadow:0 10px 30px rgba(60,50,140,.12)}
#lg{background:radial-gradient(900px 400px at 10% -10%,rgba(109,93,252,.22),transparent 60%),var(--bg)}
.lgbox{background:var(--cd);color:var(--tx);border:1px solid var(--bd);box-shadow:0 10px 30px rgba(60,50,140,.12)}
.lgbox img{box-shadow:0 6px 16px rgba(60,50,140,.2)}
.lgbox p{color:var(--mu)}
#lgp{background:var(--in);color:var(--tx);border-color:var(--bd)}
#lgb{background:var(--pr)}
#dview .dv-wrap{background:none;box-shadow:none;max-height:none;overflow:visible;min-height:0}
#dview .dv-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
#dview .dv-card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);border-left:6px solid var(--g);padding:14px 16px}
#dview .dv-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font-size:18px}
#dview .dv-grp{font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--g);color:#fff}
#dview .dv-row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--line);font-size:14px}
#dview .dv-row small{color:var(--muted);white-space:nowrap}
#dview .dv-row span{font-weight:600;text-align:right;overflow-wrap:anywhere}
#dview .dv-empty{grid-column:1/-1}
.lv{display:block;width:100%;margin-top:.6rem;height:2.9rem;border-radius:1.1rem;border:.12rem solid var(--pr);background:transparent;color:var(--pr);font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer}
.lv:disabled{opacity:.4;cursor:default}
.top{flex-wrap:wrap}
.hvbtn{height:2.3rem;padding:0 .6rem;border-radius:.7rem;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:.8rem;font-weight:700;white-space:nowrap;cursor:pointer}
</style>

<button class="lv" id="lvb" disabled>Leave</button>
</div>

<div id="dview">
  <header class="dv-head">
    <div><h1>Driver Update Sheet</h1><div class="dv-date" id="dvdate"></div></div>
    <div class="dv-right"><span class="dv-pill">শুধু দেখার জন্য</span><button class="dv-btn" id="dvx">← হ্যান্ডওভারে ফিরুন</button><button class="dv-btn red" id="dvout">Log out</button></div>
  </header>
  <div class="dv-bar">
    <div class="dv-tabs"><button data-t="v" class="on">গাড়ি</button><button data-t="d">ড্রাইভার</button></div>
    <input id="dvq" class="dv-search" placeholder="Search vehicle, driver, code, phone…" autocomplete="off">
    <span class="dv-count" id="dvn"></span>
  </div>
  <div class="dv-wrap" id="dvc"></div>
</div>
<script>
// ===== আপনার আগের Apps Script ওয়েব অ্যাপের URL (…/exec) এখানে বসান। ফাঁকা থাকলে নমুনা ডাটায় চলবে =====
const CONFIG={API:"https://script.google.com/macros/s/AKfycbxVcDt16nblwWaKFC3CXD4O-eU6dHuIVzIsP7zwarvdWCp1eCUi19OT7lNTkR6F2j4/exec",COMPANY:"কোম্পানি",GROUP:""};
// GROUP: WhatsApp গ্রুপের Invite লিংক (https://chat.whatsapp.com/…) বসালে ম্যাসেজ কপি হয়ে ওই গ্রুপের পেজ খুলবে। ফাঁকা থাকলে WhatsApp খুলে নিজে গ্রুপ বেছে নেওয়া যায়
// নিরাপদ স্টোরেজ: ব্রাউজার বন্ধ থাকলেও এরর দেবে না
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}};
let PIN=store.get("hv3pin")||"";   // PIN একবার মেমোরিতে থাকবে
let pendingLogin=null, ROLE="", DVT="v";
function askLogin(msg){
  return new Promise(res=>{
    const ov=document.getElementById("lg"), inp=document.getElementById("lgp");
    document.getElementById("lgm").textContent=msg||"আপনার PIN দিন";
    ov.classList.add("show"); inp.value=""; setTimeout(()=>inp.focus(),50);
    pendingLogin=v=>{ ov.classList.remove("show"); PIN=v; store.set("hv3pin",v); res(); };
  });
}
function submitLogin(){
  const v=document.getElementById("lgp").value.trim();
  if(v&&pendingLogin){const f=pendingLogin;pendingLogin=null;f(v)}
}
const GCOL={A:"#6d5dfc",B:"#12803f",C:"#e08a00",GA:"#2d6cdf",GB:"#db2777",BK:"#475569"};
function renderDV(){
  const raw=(D&&D.raw)||[], drv=(D&&D.drv)||{};
  const q=(document.getElementById("dvq").value||"").trim().toLowerCase();
  document.querySelectorAll(".dv-tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===DVT));
  document.getElementById("dvdate").textContent=new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  const row=(l,v)=>'<div class="dv-row"><small>'+l+'</small><span>'+esc(v)+'</span></div>';
  let html="", cnt=0;
  if(DVT==="v"){
    const rows=raw.filter(r=>!q||Object.values(r).join(" ").toLowerCase().indexOf(q)>=0);
    cnt=rows.length;
    html=rows.map(r=>'<div class="dv-card" style="--g:'+(GCOL[r.g]||"#6d5dfc")+'"><div class="dv-top"><b>'+esc(r.v)+'</b><span class="dv-grp">'+esc(r.g)+'</span></div>'+
      row("ড্রাইভার",r.name)+row("কোড",r.code)+row("মোবাইল",r.phone)+row("লোকেশন",r.loc)+row("Sub location",r.sub)+
      row("Category",r.cat)+row("Capacity",r.cap)+row("Bag",r.bag)+row("Vendor",r.vendor)+row("Status",r.status)+row("Helper Code",r.hcode)+row("Helper Name",r.hname)+row("Helper Mobile",r.hphone)+'</div>').join("");
  } else {
    const rows=Object.keys(drv).sort().map(k=>({c:k,n:drv[k]})).filter(r=>!q||(r.c+" "+r.n).toLowerCase().indexOf(q)>=0);
    cnt=rows.length;
    html=rows.map(r=>'<div class="dv-card" style="--g:#6d5dfc"><div class="dv-top"><b>'+esc(r.c)+'</b></div>'+row("নাম",r.n)+'</div>').join("");
  }
  const el=document.getElementById("dvc");
  if(!cnt) el.innerHTML='<div class="dv-cards"><p class="dv-empty">'+(raw.length||DVT==="d"?"কোনো তথ্য পাওয়া যায়নি":"ডাটা পাওয়া যায়নি — হ্যান্ডওভার পেজের ⟳ চাপুন")+'</p></div>';
  else el.innerHTML='<div class="dv-cards">'+html+'</div>';
  document.getElementById("dvn").textContent=cnt+" টি";
}
function checkRole(){
  if(!PIN)return;
  jsonp({action:"login",pin:PIN}).then(r=>{
    ROLE=(r&&r.role)||"";
    if(ROLE==="view"){document.body.classList.add("vo");renderDV()}
  }).catch(()=>{});
}
function wireDV(){
  document.getElementById("lgb").onclick=submitLogin;
  document.getElementById("lgp").addEventListener("keydown",e=>{if(e.key==="Enter")submitLogin()});
  document.getElementById("dvb").onclick=()=>{document.body.classList.add("dv");renderDV()};
  document.getElementById("dvx").onclick=()=>document.body.classList.remove("dv");
  document.getElementById("dvout").onclick=()=>{store.del("hv3pin");store.del("hv3");location.reload()};
  document.getElementById("dvq").addEventListener("input",renderDV);
  document.querySelectorAll(".dv-tabs button").forEach(b=>b.onclick=()=>{DVT=b.dataset.t;renderDV()});
}
wireDV();
const SAMPLE={vehicles:[{v:"12-0712",n:"Md. Ataur",c:"CD-2519",m:"01784411812"}],drivers:[{c:"CD-2446",n:"Md. Zobayer"},{c:"CD-2519",n:"Md. Ataur"}]};
const MON=["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
const E={};document.querySelectorAll("[id]").forEach(e=>E[e.id]=e);
const MONE=["January","February","March","April","May","June","July","August","September","October","November","December"];
const showD=()=>{const v=E.dt.value.split("-");E.dtx.textContent=v.length===3?v[2]+"-"+MONE[+v[1]-1]+"-"+v[0]:"তারিখ"};
const bn=s=>String(s).replace(/[০-৯]/g,d=>"০১২৩৪৫৬৭৮৯".indexOf(d));
const en2bn=s=>String(s).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const key=s=>bn(s).toUpperCase().replace(/[^A-Z0-9]/g,"");
const mob=s=>{const d=bn(s).replace(/\D/g,"");return d.length===11?d.slice(0,5)+"-"+d.slice(5):bn(s).trim()};
const fmtV=s=>{s=bn(s).toUpperCase();const d=s.replace(/[\s-]/g,"");return /^\d*$/.test(d)?(d.length>2?d.slice(0,2)+"-"+d.slice(2,6):d):s};
const fmtC=s=>{const m=bn(s).toUpperCase().replace(/[^A-Z0-9]/g,"").match(/^([A-Z]*)(\d*)/);return m[1]+(m[1]&&m[2]?"-":"")+m[2]};
const fmtM=s=>{const d=bn(s).replace(/\D/g,"").slice(0,11);return d.length>5?d.slice(0,5)+"-"+d.slice(5):d};
const has=i=>E[i].value.trim()!=="";
const R=["rc","rn","rm"],NM={rc:"কোড",rn:"নাম",rm:"মোবাইল"};
let D=SAMPLE,L=[],li=0,ra=false;

const today=()=>{const n=new Date();return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0")};
E.dt.value=today();showD();

let hasCache=false;
function jsonp(params){
  return new Promise((res, rej) => {
    const cb = "cb" + Date.now() + Math.floor(Math.random() * 1e6);
    const s = document.createElement("script");
    const t = setTimeout(() => { cleanup(); rej(new Error("timeout")) }, 25000);
    function cleanup(){ clearTimeout(t); delete window[cb]; s.remove() }
    window[cb] = d => { cleanup(); res(d) };
    s.onerror = () => { cleanup(); rej(new Error("network")) };
    s.src = CONFIG.API + "?" + new URLSearchParams({ ...params, callback: cb });
    document.head.appendChild(s);
  });
}
function load(){
  if(!CONFIG.API){E.ds.textContent="নমুনা ডাটা চলছে (Google Sheet যুক্ত নেই)";return Promise.resolve("ok")}
  try{const c=JSON.parse(store.get("hv3")||"null");if(c&&c.vehicles){D=c;hasCache=true}}catch(e){}
  return jsonp({action:"read", pin:PIN}).then(j=>{
    if(j.locked){
      return askLogin(PIN?"PIN ভুল — আবার দিন":"").then(()=>load());
    }
    if(!(j.ok&&j.vehicles))throw 0;
    const d={vehicles:j.vehicles.filter(x=>x.v&&x.name).map(x=>({v:x.v,n:x.name,c:x.code,m:x.phone})),
             drivers:Object.keys(j.drivers||{}).map(k=>({c:k,n:j.drivers[k]})),pr:j.pinRequired,raw:j.vehicles,drv:j.drivers||{},xc:j.extraCols||[]};
    D=d;try{store.set("hv3",JSON.stringify(d))}catch(e){}
    E.ds.textContent="";vLook();rLook();build();checkRole();return "ok";
  }).catch(()=>{E.ds.textContent="অফলাইন — আগের সেভ করা ডাটা চলছে";return hasCache?"cache":"fail"});
}

function vLook(){
  const k=key(E.veh.value);
  L=k?D.vehicles.filter(x=>key(x.v)===k):[];
  li=0;
}
function rLook(){
  const k=key(E.rc.value);let d=null;
  if(k){const num=k.replace(/^[A-Z]*/,"");if(num)d=D.drivers.find(x=>key(x.c).replace(/^[A-Z]*/,"")===num)||null}
  if(d){E.rn.value=d.n;E.rc.value=d.c.replace(/^([A-Z]+)(\d+)$/i,"$1-$2").toUpperCase();ra=true}else if(ra){E.rn.value="";ra=false}
}

function chip(el,t,c){el.textContent=t;el.className="chip "+c;el.hidden=!t}

let nhOn=false;
function build(){
  const wk=E.t3.checked,hasV=L.length>0||/^\d{2}-\d{4}$/.test(E.veh.value.trim()),d=L[li],rc=R.filter(has).length,need=[];
  E.pb.innerHTML=d?"<b>"+esc(d.n)+"</b><span>"+esc(d.c)+(d.m?" · "+esc(mob(d.m)):"")+"</span>"
    :hasV?"<b class='co'>"+CONFIG.COMPANY+"</b><span>ড্রাইভারের তথ্য নেই</span>":"<span>গাড়ি নম্বর লিখুন</span>";
  if(!d||wk)nhOn=false;
  E.nh.hidden=!d||wk;E.nh.classList.toggle("on",nhOn);E.nh.textContent=(nhOn?"✓ ":"")+"ড্রাইভার গাড়ি বুঝিয়ে দেয়নি";
  E.nx.hidden=L.length<2;E.nx.textContent=(li+1)+"/"+L.length+" ▸";

  if(!hasV)need.push("গাড়ি নম্বর");
  if(rc>0&&rc<3)R.filter(i=>!has(i)).forEach(i=>need.push(NM[i]));
  if(hasV&&!d&&rc===0&&!wk)need.push("গ্রহণকারীর তথ্য");
  if(has("rm")&&bn(E.rm.value).replace(/\D/g,"").length!==11)need.push("মোবাইল ১১ ডিজিট");
  if(rc===3&&!E.t1.checked&&!E.t2.checked)need.push("বদলি/পারমানেন্ট টিক");
  if(!E.dt.value)need.push("তারিখ");

  const pT=!hasV?["",""]:d?(nhOn?["বুঝিয়ে দেয়নি","wr"]:["✓ পাওয়া গেছে","ok"]):["কোম্পানি দিচ্ছে","co"];
  const nf=!ra&&key(E.rc.value).length>=4&&!has("rn");
  const rT=!hasV?["",""]:wk?["ওয়ার্কশপ","co"]:rc===0?["কোম্পানি নিচ্ছে","co"]:nf?["কোড পাওয়া যায়নি","wr"]:rc<3?["তথ্য অসম্পূর্ণ","wr"]:["ড্রাইভার","ok"];
  chip(E.pchip,pT[0],pT[1]);chip(E.rchip,rT[0],rT[1]);
  E.t1.parentNode.classList.toggle("off",rc===0);E.t2.parentNode.classList.toggle("off",rc===0);

  E.wa.disabled=need.length>0;
  E.lvb.disabled=!E.veh.value.trim();
  if(need.length){E.hint.textContent="বাকি: "+need.join(", ");E.hint.className="hint"}
  else{E.hint.textContent="প্রস্তুত ✓  "+(d?(nhOn?"ড্রাইভার (দেয়নি)":"ড্রাইভার"):"কোম্পানি")+" → "+(wk?"ওয়ার্কশপ":rc?"ড্রাইভার":"কোম্পানি");E.hint.className="hint ok"}
}

function vtLine(v){
  const r=(D&&D.raw||[]).filter(x=>key(x.v)===key(v))[0];
  if(!r||!r.bag)return "";
  const c=String(r.cat||"").toLowerCase();
  const t=(r.g==="BK"||/bulk/.test(c+" "+r.sub+" "+r.loc))?"বাল্ক":(c.indexOf("cv")>=0?"সিভি":(/(^|\W)ot($|\W)/.test(c)?"ওটি":(r.cat||"")));
  return "\nগাড়ীর ধরন: "+en2bn(String(r.bag))+" ব্যাগ"+(t?" ("+t+")":"");
}
function msgText(){
  const d=L[li],[y,m,dd]=E.dt.value.split("-"),CO=CONFIG.COMPANY,rn=E.rn.value.trim(),wk=E.t3.checked;
  const blk=(n,c,mo)=>n?n+"\nকোড নং: "+bn(c).toUpperCase()+(mo?"\nমোবাইল নং: "+mob(mo):""):CO;
  const end=wk?"গাড়িটি *🔵 ওয়ার্কশপে* বুঝিয়ে দেওয়া হলো।":rn&&nhOn?"⚠️ প্রদানকারী ড্রাইভার গাড়িটি বুঝিয়ে দেয়নি, তাই কোম্পানী হতে নতুন এই ড্রাইভারকে *"+(E.t1.checked?"🟠 বদলি":"🟢 পারমানেন্ট")+"* হিসেবে গাড়িটি বুঝিয়ে দেওয়া হলো।":rn?"গাড়িটি *"+(E.t1.checked?"🟠 বদলি":"🟢 পারমানেন্ট")+"* চালানোর জন্য বুঝিয়ে দেওয়া হলো।":nhOn?"গাড়িটি *⚠️ ড্রাইভার বুঝিয়ে দেয়নি*, কোম্পানি নিজ দায়িত্বে গাড়িটি বুঝিয়ে নিলো।":"গাড়িটি *কোম্পানির* কাছে বুঝিয়ে দেওয়া হলো।";
  return "আসসালামু আলাইকুম,\n\nতারিখ: "+en2bn(dd)+" "+MON[+m-1]+" "+en2bn(y)+"\nগাড়ি: "+bn(E.veh.value).trim().toUpperCase()+vtLine(E.veh.value.trim())+
    "\n\n"+(nhOn?"*গাড়ির ড্রাইভারের তথ্য:*":"*গাড়ি প্রদানকারীর তথ্য:*")+"\n"+blk(d&&d.n,d&&d.c,d&&d.m)+
    "\n\n*গাড়ি গ্রহণকারীর তথ্য:*\n"+(wk?"ওয়ার্কশপ":blk(rn,E.rc.value,E.rm.value))+
    "\n\n"+end;
}

document.addEventListener("input",e=>{
  const i=e.target.id;
  if(fbUrl){fbUrl="";E.wat.textContent="WhatsApp-এ পাঠান"}
  if(i==="dt")showD();
  if(i==="veh")nhOn=false;
  if(["rc","rn","rm"].includes(i)&&E.t3.checked)E.t3.checked=false;
  if(i==="veh")e.target.value=fmtV(e.target.value);
  if(i==="rc")e.target.value=fmtC(e.target.value);
  if(i==="rm")e.target.value=fmtM(e.target.value);
  if(i==="veh")vLook();
  if(i==="rc")rLook();
  build();
});
E.dt.addEventListener("change",()=>{showD();build()});
E.rm.addEventListener("blur",()=>{E.rm.value=mob(E.rm.value);build()});
[E.t1,E.t2,E.t3].forEach(t=>t.onchange=()=>{
  if(t.checked)[E.t1,E.t2,E.t3].forEach(o=>{if(o!==t)o.checked=false});
  if(t===E.t3&&t.checked){["rc","rn","rm"].forEach(i=>E[i].value="");ra=false}
  build()});
E.nh.onclick=()=>{nhOn=!nhOn;build()};
E.nx.onclick=()=>{li=(li+1)%L.length;build()};

let fbUrl="",armed=false,opened=false;
// ইনস্টল করা WhatsApp অ্যাপ সরাসরি খোলে (ওয়েব পেজ ছাড়া)। না খুললে বাটনে আবার চাপার ব্যবস্থা আসে। WhatsApp থেকে ফিরলে ফর্ম ফাঁকা হয়।
function openWA(url){
  armed=true;opened=false;
  location.href=url;
  setTimeout(()=>{if(!opened){fbUrl=url;E.wa.disabled=false;E.wat.textContent="WhatsApp খুলুন";E.hint.textContent="WhatsApp খোলেনি — বাটনে আবার চাপুন";E.hint.className="hint"}},1800);
}
document.addEventListener("visibilitychange",()=>{
  if(!armed)return;
  if(document.hidden)opened=true;
  else if(opened)resetForm();
});
function resetForm(){fbUrl="";armed=opened=false;E.wat.textContent="WhatsApp-এ পাঠান";["veh","rc","rn","rm"].forEach(i=>E[i].value="");E.t1.checked=E.t2.checked=E.t3.checked=false;nhOn=false;L=[];li=0;ra=false;E.dt.value=today();showD();build()}
E.clr.onclick=resetForm;

E.lvb.onclick=async()=>{
  const v=E.veh.value.trim();
  if(!v)return;
  const d=D.vehicles.filter(x=>key(x.v)===key(v))[0];
  const [y,m,dd]=(E.dt.value||today()).split("-");
  const t="আসসালামু আলাইকুম,\n\nতারিখ: "+en2bn(dd)+" "+MON[+m-1]+" "+en2bn(y)+"\nগাড়ি: "+bn(v).toUpperCase()+vtLine(v)+
    "\n\n*ড্রাইভারের তথ্য:*\n"+(d?d.n+"\nকোড নং: "+bn(d.c).toUpperCase()+(d.m?"\nমোবাইল নং: "+mob(d.m):""):"তথ্য নেই")+
    "\n\nড্রাইভার গাড়ীটি কোম্পানীকে বুঝিয়ে দিয়ে ছুটিতে গেছে।";
  const c=(CONFIG.GROUP&&navigator.clipboard)?await navigator.clipboard.writeText(t).then(()=>true,()=>false):false;
  openWA((CONFIG.GROUP&&c)?CONFIG.GROUP:"whatsapp://send?text="+encodeURIComponent(t));
};
E.wa.onclick=async()=>{
  if(fbUrl){openWA(fbUrl);return}
  const t=msgText(),veh=E.veh.value.trim(),rn=E.rn.value.trim(),code=E.rc.value.trim(),ph=bn(E.rm.value).replace(/\D/g,""),type=rn?(E.t1.checked?"sub":"perm"):(E.t3.checked?"work":"");
  const copied=(CONFIG.GROUP&&navigator.clipboard)?navigator.clipboard.writeText(t).then(()=>true,()=>false):Promise.resolve(false);
  let ok=true,err="";
  if(CONFIG.API){
    E.wa.disabled=true;E.wat.textContent="সেভ হচ্ছে…";
    try{
            const r=await jsonp({action:"handover",v:veh,code:rn?code:"",phone:rn?ph:"",type:type,pin:PIN});
      ok=!!r.ok;err=r.error||"";
      if(ok){
        D.vehicles=D.vehicles.filter(x=>key(x.v)!==key(veh));
        if(rn)D.vehicles.push({v:veh,n:rn,c:code,m:ph});
        try{store.set("hv3",JSON.stringify(D))}catch(e){}
      }
    }catch(e){ok=false;err="ইন্টারনেট/সার্ভার সমস্যা"}
    E.wat.textContent="WhatsApp-এ পাঠান";
  }
  if(!ok&&!confirm("Google Sheet-এ সেভ হয়নি ("+err+")।\nতবুও WhatsApp-এ পাঠাবেন?")){build();return}
  const c=await copied;
  openWA((CONFIG.GROUP&&c)?CONFIG.GROUP:"whatsapp://send?text="+encodeURIComponent(t));
};
build();
E.bmp.onclick=()=>{if(window.parent&&parent.openEntry)parent.openEntry()};
E.lgo.onclick=()=>{if(window.parent&&parent.logout)parent.logout("")};
// স্প্লাশ: আসল ডাটা লোড শেষ হলে (সর্বনিম্ন ২.৬ সেকেন্ড অ্যানিমেশনের পর) মূল পেজে যায়। ডাটা না এলে অসম্পূর্ণ পেজ দেখায় না।
let T0=performance.now(),res=null,done=false;
const MIN=900,CAP=8000;
function run(){T0=performance.now();res=null;E.sx.hidden=true;E.sp.classList.remove("er");E.st.innerHTML='Loading<span class="dots">...</span>';load().then(r=>{res=r})}
setInterval(()=>{
  if(done)return;
  const el=performance.now()-T0,p=Math.min(1,el/MIN)*100;
  if(res==="fail"){E.sp.classList.add("er");E.st.textContent="ডাটা লোড হয়নি — ইন্টারনেট চেক করুন";E.sx.hidden=false;return}
  const ready=hasCache||res==="ok"||res==="cache";
  E.bar.style.width=(ready?p:Math.min(p,92))+"%";
  if(ready&&el>=MIN){done=true;E.bar.style.width="100%";E.sp.style.opacity=0;setTimeout(()=>E.sp.remove(),600)}
},60);
E.sx.onclick=run;
run();
